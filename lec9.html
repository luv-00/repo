<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        th, td {
  border: 1px solid black;} 
       
    </style>
</head>
<body>
     <table cellpadding="10" cellspacing="5" width="80%" border="2" align="center">
        <caption><b>Quarterly Sales Report (INR)</b></caption>
        <tr bgcolor="grey" height="60px" align="center">
            <th>Category</th>
            <th>Product</th>
            <th>Q1 Sales</th>
            <th>Q2 Sales</th>
        </tr>
        <tr height="45px" align="left">
            <td rowspan="2" valign="top">Electronics</td>
            <td>Smartphone</td>
            <td align="right">₹4,72,450</td>
            <td align="right">₹5,85,838</td>
        </tr>
        <tr height="45px" align="left">
            <td>Laptops</td>
            <td align="right">₹8,03,165</td>
            <td align="right">₹8,59,859</td>
        </tr>
        <tr bgcolor="lightgrey" height="60px">
            <td colspan="2">
              <b> Total Gross</b>
            </td>
            <td align="right"><b>₹12,75,615</b></td>
            <td align="right"><b>₹14,45,659</b></td>
        </tr>

    </table>
    
</body>
</html>
